<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision CRM</title>
  <style>
    /* mesmas cores da extensão e do painel web */
    body { width: 300px; margin: 0; padding: 18px; font-family: 'Segoe UI', system-ui, sans-serif; color: #e9edef; background: #141515; }
    h1 { display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 0 0 14px; color: #fff; } h1 b { color: #ff02a6; }
    .hide { display: none !important; }
    .card { background: #202222; border: 1px solid rgba(154,155,155,.45); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; }
    .av { width: 42px; height: 42px; flex: none; border-radius: 50%; background: #9a9b9b; color: #141515; display: grid; place-items: center; font-weight: 700; font-size: 16px; }
    .who { min-width: 0; }
    .who b { display: block; font-size: 14px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .who small { display: block; font-size: 11px; color: #9a9b9b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { display: flex; align-items: center; gap: 7px; margin: 12px 2px 0; font-size: 12px; color: #7ef0c0; }
    .status i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; }
    .status.off { color: #ffb39c; } .status.off i { background: #ff7a59; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; color: #c9cccd; }
    input { width: 100%; box-sizing: border-box; color: #e9edef; background: rgba(255,255,255,.06);
      border: 1px solid rgba(154,155,155,.35); border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none; }
    input::placeholder { color: #6f7171; }
    input:focus { border-color: #9a9b9b; }
    button { width: 100%; margin-top: 14px; background: #ff02a6; color: #fff; border: none; border-radius: 10px;
      padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.12); }
    button.ghost { background: transparent; color: #e9edef; border: 1px solid rgba(154,155,155,.45); margin-top: 8px; }
    button.ghost:hover { filter: none; background: rgba(255,255,255,.07); }
    p.sub, .sub { font-size: 12px; color: #9a9b9b; margin: 0 0 6px; }
    .msg { font-size: 12px; margin-top: 10px; min-height: 16px; color: #ff8a8a; }
  </style>
</head>
<body>
  <h1>Vision <b>CRM</b></h1>

  <div id="loading" class="p sub">Verificando conexão…</div>

  <div id="on" class="hide">
    <div class="card">
      <div class="av" id="av">V</div>
      <div class="who"><b id="name"></b><small id="email"></small></div>
    </div>
    <div class="status"><i></i><span>Conectado e funcionando</span></div>
    <button id="open">Abrir painel</button>
    <button id="out" class="ghost">Desconectar</button>
  </div>

  <div id="off" class="hide">
    <p class="sub" id="offSub">Cole o seu token pra conectar. Ele fica em Configurações, no site.</p>
    <label for="apiUrl">URL do sistema</label>
    <input id="apiUrl" type="text" placeholder="https://seu-crm.vercel.app" />
    <label for="token">Token de acesso</label>
    <input id="token" type="password" placeholder="crm_..." />
    <button id="save">Conectar</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
