<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision CRM</title>
  <style>
    body { width: 300px; margin: 0; padding: 18px; font-family: 'Segoe UI', system-ui, sans-serif; color: #e8eefc;
      background: radial-gradient(400px 200px at 90% -10%, rgba(59,130,246,.25), transparent 60%), #040a1c; }
    h1 { font-size: 16px; margin: 0 0 4px; color: #fff; } h1 b { color: #e0245e; }
    p.sub { font-size: 12px; color: #8ea0c8; margin: 0 0 14px; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; color: #c9d5f2; }
    input { width: 100%; box-sizing: border-box; color: #e8eefc; background: rgba(255,255,255,.07);
      border: 1px solid rgba(143,163,214,.25); border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none; }
    input:focus { border-color: #e0245e; box-shadow: 0 0 0 3px rgba(224,36,94,.22); }
    button { width: 100%; margin-top: 14px; background: #e0245e; color: #fff; border: none; border-radius: 10px;
      padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 0 16px rgba(224,36,94,.45); }
    button:hover { filter: brightness(1.12); }
    .msg { font-size: 12px; margin-top: 10px; min-height: 16px; }
    .ok { color: #7ef0c0; } .err { color: #ff8a8a; }
  </style>
</head>
<body>
  <h1>Vision <b>CRM</b></h1>
  <p class="sub">Conecte ao seu Vision CRM.</p>

  <label for="apiUrl">URL do sistema</label>
  <input id="apiUrl" type="text" placeholder="http://localhost:3001" />

  <label for="token">Token de acesso</label>
  <input id="token" type="password" placeholder="crm_..." />

  <button id="save">Salvar e testar conexão</button>
  <div class="msg" id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
